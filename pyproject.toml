[project]
name = "caddy-cloudflare-proxy-v2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.9,<4",
    "fastapi>=0.135",
    "httpx>=0.28",
    "docker>=7.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.13",
    "aiofiles>=25.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.format]
quote-style = "double"
