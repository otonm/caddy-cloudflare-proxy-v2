name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository }}/app
  IMAGE_CADDY: ghcr.io/${{ github.repository }}/caddy
  DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
  DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  changes:
    runs-on: ubuntu-latest
    outputs:
      caddy: ${{ steps.filter.outputs.caddy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            caddy:
              - 'Dockerfile.caddy'

  build-app:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_APP }}:latest

  build-caddy:
    runs-on: ubuntu-latest
    needs: [lint, changes]
    # Only rebuild when Dockerfile.caddy itself changes — it has no local source
    # dependencies, so other commits never affect the output image.
    if: needs.changes.outputs.caddy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_CADDY }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-app, build-caddy]
    # always() lets this job run even when build-caddy was skipped.
    # Job-level if: only supports github, needs, vars, and inputs contexts —
    # env/secrets are not available here; the webhook URL guard is on the step.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.build-app.result == 'success' &&
      (needs.build-caddy.result == 'success' || needs.build-caddy.result == 'skipped')
    steps:
      - name: Trigger Dockhand redeployment
        # env context is available at step level, so the URL guard works here.
        if: env.DOCKHAND_WEBHOOK_URL != ''
        run: |
          PAYLOAD='{}'
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | \
            openssl dgst -sha256 -hmac "${{ env.DOCKHAND_WEBHOOK_SECRET }}" | \
            awk '{print $NF}')"

          curl -v -sf -X POST \
            "${{ env.DOCKHAND_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "CF-Access-Client-Id: ${{ env.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ env.CF_ACCESS_CLIENT_SECRET }}" \
            -d "$PAYLOAD"
