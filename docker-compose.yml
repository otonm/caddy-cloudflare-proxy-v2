services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-proxy-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - proxy_net

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  proxy_net:
    driver: bridge
