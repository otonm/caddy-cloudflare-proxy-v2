services:
  caddy:
    image: ghcr.io/otonm/caddy-cloudflare-proxy-v2/caddy:latest
    container_name: proxy-caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - default
      - proxy

  proxy-webui:
    image: ghcr.io/otonm/caddy-cloudflare-proxy-v2/app:latest
    container_name: proxy-webui
    restart: unless-stopped
    ports:
      - 8088:8088
    volumes:
      - app_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
      APP_SECRET: ${APP_SECRET:-}
      TS_API_KEY: ${TS_API_KEY}
      TS_TAILNET: ${TS_TAILNET}
      ACME_EMAIL: ${ACME_EMAIL}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL}
      DEBUG: ${DEBUG}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  default:
    driver: bridge
  proxy:
    external: true
