services:
  caddy:
    image: ghcr.io/otonm/caddy-cloudflare-proxy-v2/caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy_net

  app:
    image: ghcr.io/otonm/caddy-cloudflare-proxy-v2/app:latest
    container_name: caddy-proxy-app
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - app_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional: mount the Tailscale daemon socket to enable automatic Tailscale
      # source-IP detection without setting TS_HOST_NAME. Requires Tailscale to be
      # installed and running on the host. Remove if not using Tailscale source IP.
      - /run/tailscale/tailscaled.sock:/run/tailscale/tailscaled.sock:ro
    env_file:
      - .env
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - proxy_net

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  proxy_net:
    driver: bridge
